model:
  d_model: 768
  n_layers: 16
  swa_every: 4
  n_heads: 8
  head_dim: 64
  window: 512
  chunk: 64
  block: 512
  n_slots: 32
  mlp_mult: 4
  conv_kernel: 4
  grad_checkpoint: true   # indispensable sur T4 15 Go : ~30 % de calcul en plus, mémoire d'activations divisée
train:
  seq_len: 4096
  batch_size: 8          # par GPU
  grad_accum: 8          # batch effectif 2 GPU × 8 × 8 × 4096 ≈ 0,5 M octets (spec §6.1)
  lr: 3.0e-4
  warmup_frac: 0.1       # warmup = 10 % du run, quel que soit max_steps (prime sur warmup_steps)
  warmup_steps: 2000     # ignoré tant que warmup_frac est défini
  max_steps: 2500        # ≈ 1,3 Go d'octets ; mesuré sur 2×T4 : ~56 s/pas → ~39 h, trois sessions Kaggle
  compile: false         # torch.compile sur le cœur GDN ; mesurer d'abord avec `bench --compile`
  weight_decay: 0.1
  grad_clip: 1.0
  amp: true
  ckpt_every_minutes: 30
  log_every: 20
  hub_repo: null         # ex. "utilisateur/relis-v1-pretrain" ; token dans HF_TOKEN
  hub_every_minutes: 120 # le local reste à 30 min ; le Hub coûte du quota LFS
  time_budget_hours: 11.5 # Kaggle coupe à 12 h : sortir proprement avant
data:
  # Kaggle monte en réalité sous /kaggle/input/datasets/<utilisateur>/relis-shards/ ; si le chemin
  # ci-dessous n'existe pas, pretrain.py cherche un fichier du même nom sous /kaggle/input.
  train_bin: /kaggle/input/relis-shards/train.bin
  val_bin: /kaggle/input/relis-shards/val.bin
